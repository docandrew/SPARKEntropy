name: NIST Entropy

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      bytes:
        description: Number of entropy bytes to assess
        required: true
        default: "1048576"
      min_bits_per_byte:
        description: Minimum accepted assessed min-entropy
        required: true
        default: "7.0"

permissions:
  contents: read

jobs:
  nist-entropy:
    env:
      ALR_NON_INTERACTIVE: "1"
      NO_COLOR: "1"
      SPARKENTROPY_HOST_ARCH: x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: false

      - uses: DeterminateSystems/nix-installer-action@e50d5f73bfe71c2dd0aa4218de8f4afa59f8f81d # v16

      - name: NIST SP 800-90B entropy assessment
        env:
          NIST_MIN_BITS_PER_BYTE: ${{ inputs.min_bits_per_byte || '7.0' }}
          NIST_REF: 87c104d0ed4cbc96103e7b8b38d6f2c7e0a6b289
        run: nix develop --command bash ci/nist_entropy.sh "${{ inputs.bytes || '1048576' }}"
