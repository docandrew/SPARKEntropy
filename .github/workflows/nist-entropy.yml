name: NIST Entropy

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      osr:
        description: Oversampling rate to validate against (min-entropy per delta must reach 1/OSR)
        required: true
        default: "3"
      num_events:
        description: Runtime deltas to record (SP 800-90B needs at least 1,000,000)
        required: true
        default: "1000000"

permissions:
  contents: read

jobs:
  nist-entropy:
    env:
      ALR_NON_INTERACTIVE: "1"
      NO_COLOR: "1"
      SPARKENTROPY_HOST_ARCH: x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: false

      - uses: DeterminateSystems/nix-installer-action@e50d5f73bfe71c2dd0aa4218de8f4afa59f8f81d # v16

      - name: NIST SP 800-90B raw noise-source assessment (runtime + restart)
        env:
          OSR: ${{ inputs.osr || '3' }}
          NUM_EVENTS: ${{ inputs.num_events || '1000000' }}
          NIST_REF: 87c104d0ed4cbc96103e7b8b38d6f2c7e0a6b289
        run: nix develop --command bash ci/nist_entropy.sh
